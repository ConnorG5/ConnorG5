<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Homepage</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #2ECC40;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .smiley {
            width: 200px;
            height: 200px;
            background-color: #FFDD00;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .eye {
            width: 20px;
            height: 20px;
            background-color: #333;
            border-radius: 50%;
            position: absolute;
            top: 60px;
        }

        .eye.left {
            left: 55px;
        }

        .eye.right {
            right: 55px;
        }

        .mouth {
            width: 100px;
            height: 50px;
            border: 5px solid #333;
            border-top: none;
            border-radius: 0 0 100px 100px;
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>
    <div class="smiley">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
    </div>
</body>
</html>
